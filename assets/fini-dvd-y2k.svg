<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t">
  <title id="t">Disco holográfico estilo Y2K</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3ec"/>
      <stop offset=".3" stop-color="#c4a6ff"/>
      <stop offset=".6" stop-color="#8fe9ff"/>
      <stop offset=".85" stop-color="#d4ffe9"/>
      <stop offset="1" stop-color="#ffd1f4"/>
    </linearGradient>

    <linearGradient id="wA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#8a5cff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="wB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ffe36b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4dffb0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="wC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff9ee5" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="wD" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4dffb0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity=".6"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c4a6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset=".88" stop-color="#c4a6ff" stop-opacity="0"/>
      <stop offset=".92" stop-color="#c4a6ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#c4a6ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="disc"><circle cx="200" cy="200" r="180"/></clipPath>
    <mask id="hole">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="200" r="20" fill="#000"/>
    </mask>

    <!-- brilho de 4 pontas -->
    <path id="sp" d="M0 -1 Q.12 -.12 1 0 Q.12 .12 0 1 Q-.12 .12 -1 0 Q-.12 -.12 0 -1Z"/>
  </defs>

  <!-- halo suave atrás do disco -->
  <circle cx="200" cy="200" r="198" fill="url(#glow)"/>

  <g mask="url(#hole)">
    <g clip-path="url(#disc)">
      <circle cx="200" cy="200" r="180" fill="url(#base)"/>

      <!-- trilhas do disco -->
      <g fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width=".8">
        <circle cx="200" cy="200" r="170"/>
        <circle cx="200" cy="200" r="152"/>
        <circle cx="200" cy="200" r="134"/>
        <circle cx="200" cy="200" r="116"/>
        <circle cx="200" cy="200" r="98"/>
        <circle cx="200" cy="200" r="80"/>
      </g>

      <!-- reflexos holográficos -->
      <path d="M200 200 L261.6 30.9 A180 180 0 0 1 355.9 110 Z" fill="url(#wA)"/>
      <path d="M200 200 L138.4 369.2 A180 180 0 0 1 44.1 290 Z" fill="url(#wB)"/>
      <path d="M200 200 L369.2 261.6 A180 180 0 0 1 337.9 315.7 Z" fill="url(#wC)"/>
      <path d="M200 200 L30.9 138.4 A180 180 0 0 1 62.1 84.3 Z" fill="url(#wD)"/>

      <!-- brilho de luz -->
      <ellipse cx="150" cy="130" rx="90" ry="24" transform="rotate(-35 150 130)" fill="url(#glare)"/>

      <!-- anel interno de plástico transparente -->
      <circle cx="200" cy="200" r="58" fill="#ffffff" fill-opacity=".28"/>
      <circle cx="200" cy="200" r="58" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="44" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
    </g>

    <!-- borda prateada -->
    <circle cx="200" cy="200" r="179" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>

  <!-- contorno do furo -->
  <circle cx="200" cy="200" r="20" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.5"/>

  <!-- brilhinhos Y2K -->
  <use href="#sp" transform="translate(40 42) scale(16)" fill="#ffffff"/>
  <use href="#sp" transform="translate(366 38) scale(10)" fill="#7ee8ff"/>
  <use href="#sp" transform="translate(368 368) scale(17)" fill="#ff9ee5"/>
  <use href="#sp" transform="translate(32 366) scale(9)" fill="#c4a6ff"/>
  <use href="#sp" transform="translate(386 200) scale(6)" fill="#ffffff"/>
  <use href="#sp" transform="translate(14 210) scale(6)" fill="#ffffff"/>
</svg>
